name: CI

on:
  push:
    branches: [ dev, main, master ]
  pull_request:
    branches: [ dev, main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Shevery-API Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Ensure Android SDK platform and build-tools
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Modules
        run: |
          ./gradlew :shared:assembleDebug :aidl:assembleDebug :api:assembleDebug :provider:assembleDebug :demo:assembleDebug --stacktrace --no-daemon

      - name: Upload AAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shevery-api-aars
          path: |
            aidl/build/outputs/aar/*.aar
            shared/build/outputs/aar/*.aar
            api/build/outputs/aar/*.aar
            provider/build/outputs/aar/*.aar
          retention-days: 7
          if-no-files-found: warn

      - name: Build Summary
        if: always()
        run: |
          echo "## Shevery-API Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ All Shevery-API modules built successfully." >> $GITHUB_STEP_SUMMARY
