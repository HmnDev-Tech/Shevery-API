apply from: 'manifest.gradle'

allprojects {
    tasks.withType(Javadoc) {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}

subprojects {
    afterEvaluate { project ->
        if (!(it.findProperty('publishLibrary') ?: false)) {
            return
        }

        plugins.apply('maven-publish')
        plugins.apply('signing')

        if (project.parent == rootProject) {
            group = "${groupIdBase}"
        } else {
            group = "${groupIdBase}.${project.parent.name}"
        }
        def resolvedVersion = (project.findProperty('publishVersion') ?: api_version_name).toString()
        version = resolvedVersion
        println("${project.displayName}: ${group}:${project.name}:${version}")

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    groupId = project.group.toString()
                    artifactId = project.name
                    version = resolvedVersion
                    afterEvaluate {
                        from components.release
                    }
                    pom {
                        name = POM_NAME
                        description = POM_DESCRIPTION
                        url = POM_URL
                        licenses {
                            license {
                                name = POM_LICENCE_NAME
                                url = POM_LICENCE_URL
                            }
                        }
                        developers {
                            developer {
                                id = POM_DEVELOPER_ID
                                name = POM_DEVELOPER_NAME
                                url = POM_DEVELOPER_URL
                            }
                        }
                        scm {
                            connection = POM_SCM_CONNECTION
                            developerConnection = POM_SCM_DEV_CONNECTION
                            url = POM_SCM_URL
                        }
                    }
                }
            }
            repositories {
                maven {
                    name = 'localRepo'
                    url = rootProject.layout.buildDirectory.dir('repo')
                }
                maven {
                    name = 'GitHubPackages'
                    url = uri('https://maven.pkg.github.com/HmnDev-Tech/Shevery-API')
                    credentials {
                        username = (project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR') ?: 'HmnDev-Tech').toString()
                        password = (project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN') ?: '').toString()
                    }
                }
                maven {
                    name = 'ossrh'
                    url = 'https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/'
                    credentials(PasswordCredentials)
                }
            }
        }

        android {
            publishing {
                singleVariant("release") {
                    withSourcesJar()
                    withJavadocJar()
                }
            }
        }

        signing {
            def signingKey = findProperty("signingKey")
            def signingPassword = findProperty("signingPassword")
            def secretKeyRingFile = findProperty("signing.secretKeyRingFile")

            if (secretKeyRingFile != null && file(secretKeyRingFile).exists()) {
                sign publishing.publications
            } else if (signingKey != null) {
                useInMemoryPgpKeys(signingKey, signingPassword)
                sign publishing.publications
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    groupIdBase = "com.hamondev.shevery.api"

    POM_INCEPTION_YEAR = "2026"
    POM_PACKAGING = "aar"

    POM_URL = "https://github.com/HmnDev-Tech/shevery-api"
    POM_SCM_URL = "https://github.com/HmnDev-Tech/shevery-api"
    POM_SCM_CONNECTION = "scm:git@github.com:HmnDev-Tech/shevery-api.git"
    POM_SCM_DEV_CONNECTION = "scm:git@github.com:HmnDev-Tech/shevery-api.git"

    POM_LICENCE_NAME = "MIT License"
    POM_LICENCE_URL = "https://github.com/HmnDev-Tech/shevery-api/blob/main/LICENSE"
    POM_LICENCE_DIST = "repo"

    POM_DEVELOPER_ID = "hmndev"
    POM_DEVELOPER_NAME = "HmnDev-Tech"
    POM_DEVELOPER_URL = "https://github.com/HmnDev-Tech"
}
